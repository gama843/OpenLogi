name: Format thumbwheel route

on:
  push:
    branches:
      - feat/thumbwheel-native-zoom

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/thumbwheel-native-zoom
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and remove helper
        run: |
          cargo fmt --all
          rm .github/workflows/format-thumbwheel-route.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format thumbwheel background routing"
          git push origin HEAD:feat/thumbwheel-native-zoom
